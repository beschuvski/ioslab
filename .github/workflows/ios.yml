name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      appetize:
        description: "Upload the native Simulator build to Appetize.io"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  # ---------------------------------------------------------------------------
  # Flutter: analyse, test, build for the iOS Simulator, run it, screenshot it.
  # ---------------------------------------------------------------------------
  flutter-ios:
    name: Flutter / iOS Simulator
    runs-on: ${{ vars.IOS_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve packages
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Format check
        working-directory: apps/flutter_app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/flutter_app
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        working-directory: apps/flutter_app
        run: flutter test --reporter expanded

      - name: Build for iOS Simulator
        working-directory: apps/flutter_app
        # On failure, surface the log tail as a check-run annotation so the
        # failure is diagnosable without authenticated log access.
        run: |
          set +e
          flutter build ios --simulator --debug 2>&1 | tee build-ios.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            errs=$(grep -nE "Error:|error:|Exception|No such file|not found|requires" build-ios.log | tail -n 25 | sed 's/%/%25/g' | tr -d '\r' | awk 'NF{printf "%s%%0A", $0}')
            body=${errs:-$(tail -n 60 build-ios.log | sed 's/%/%25/g' | tr -d '\r' | awk 'NF{printf "%s%%0A", $0}')}
            echo "::error::flutter build ios failed (exit $code)%0A$body"
          fi
          exit "$code"

      - name: Boot simulator, install, screenshot
        run: |
          bash scripts/ios-sim.sh run \
            --app apps/flutter_app/build/ios/iphonesimulator/Runner.app \
            --bundle com.ioslab.ioslabApp \
            --out artifacts/screenshots \
            --name flutter

      - name: Package simulator build
        run: |
          mkdir -p artifacts/app
          ditto -c -k --keepParent \
            apps/flutter_app/build/ios/iphonesimulator/Runner.app \
            artifacts/app/ioslab-flutter-simulator.zip

      - name: Summary
        if: always()
        run: |
          {
            echo "### Flutter / iOS Simulator"
            echo ""
            echo "- Flutter: \`${{ env.FLUTTER_VERSION }}\`"
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            echo "- Artifacts: screenshots (light + dark), simulator .app zip"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-ios
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Native SwiftUI: project generated from project.yml by XcodeGen, then built,
  # unit-tested, run and screenshotted on the same simulator stack.
  # ---------------------------------------------------------------------------
  native-ios:
    name: SwiftUI / XcodeGen
    runs-on: ${{ vars.IOS_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/native_app
        run: |
          xcodegen generate
          xcodebuild -list -project NativeLab.xcodeproj

      - name: Select simulator
        id: sim
        run: echo "udid=$(bash scripts/ios-sim.sh resolve)" >> "$GITHUB_OUTPUT"

      - name: Build and unit-test
        working-directory: apps/native_app
        # Same trick as the Flutter job: on failure the log tail becomes a
        # check-run annotation, readable without authenticated log access.
        run: |
          mkdir -p build
          set +e
          xcodebuild test \
            -project NativeLab.xcodeproj \
            -scheme NativeLab \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            errs=$(grep -nE "error:|fatal error:|Undefined symbols|The following build commands failed|Testing failed|BUILD FAILED|Command .* failed" build/xcodebuild.log | tail -n 25 | sed 's/%/%25/g' | tr -d '\r' | awk 'NF{printf "%s%%0A", $0}')
            body=${errs:-$(tail -n 60 build/xcodebuild.log | sed 's/%/%25/g' | tr -d '\r' | awk 'NF{printf "%s%%0A", $0}')}
            echo "::error::xcodebuild test failed (exit $code)%0A$body"
          fi
          exit "$code"

      - name: Screenshot the running app
        run: |
          bash scripts/ios-sim.sh run \
            --app apps/native_app/build/Build/Products/Debug-iphonesimulator/NativeLab.app \
            --bundle com.ioslab.nativelab \
            --out artifacts/screenshots \
            --name native

      - name: Package simulator build
        run: |
          mkdir -p artifacts/app
          ditto -c -k --keepParent \
            apps/native_app/build/Build/Products/Debug-iphonesimulator/NativeLab.app \
            artifacts/app/ioslab-native-simulator.zip
          mkdir -p artifacts/test-results
          cp -R apps/native_app/build/TestResults.xcresult artifacts/test-results/ 2>/dev/null || true

      - name: Upload to Appetize.io (optional)
        if: ${{ inputs.appetize }}
        continue-on-error: true
        env:
          APPETIZE_API_KEY: ${{ secrets.APPETIZE_API_KEY }}
        run: |
          if [ -z "${APPETIZE_API_KEY:-}" ]; then
            echo "APPETIZE_API_KEY is not configured; skipping upload."
            exit 0
          fi
          ditto -c -k --keepParent \
            apps/native_app/build/Build/Products/Debug-iphonesimulator/NativeLab.app \
            /tmp/ioslab.zip
          curl -sS -X POST https://api.appetize.io/v1/apps \
            -H "X-API-KEY: ${APPETIZE_API_KEY}" \
            -F "file=@/tmp/ioslab.zip" \
            -F "platform=ios" \
            -o /tmp/appetize.json
          echo "Appetize response: $(cat /tmp/appetize.json)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### SwiftUI / XcodeGen"
            echo ""
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            echo "- Simulator: \`${{ steps.sim.outputs.udid }}\`"
            echo "- Artifacts: screenshots (light + dark), .app zip, xcresult"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14


